<!-- inventario/templates/inventario/base.html -->
<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SNEAK//CTRL{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
            --font-display: "Barlow Condensed", Impact, sans-serif;
        }

        @layer base {
            body {
                @apply min-h-screen font-sans text-stone-950 antialiased;
                background-image:
                    linear-gradient(rgba(28, 28, 27, .045) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(28, 28, 27, .045) 1px, transparent 1px),
                    linear-gradient(135deg, #f4f1e8 0%, #ece9df 48%, #e3e0d6 100%);
                background-size: 32px 32px, 32px 32px, auto;
                background-attachment: fixed;
            }

            ::selection { background: #c7f000; color: #1c1c1b; }
        }

        @layer components {
            .display-font { font-family: var(--font-display); }
            .street-panel { @apply border-2 border-stone-950 bg-[#f8f6ef] shadow-[6px_6px_0_#1c1c1b]; }
            input, select, textarea { @apply w-full rounded-none border-2 border-stone-300 bg-[#fcfbf6] px-3 py-3 text-sm text-stone-950 outline-none transition focus:border-lime-500 focus:ring-4 focus:ring-lime-200; }
        }
    </style>
</head>

<body>
    <a href="#contenido" class="sr-only z-50 bg-stone-950 px-4 py-3 font-semibold text-white focus:not-sr-only focus:absolute focus:left-4 focus:top-4">Saltar al contenido</a>
    <header class="border-b-2 border-stone-950 bg-stone-950 px-4 py-4 text-[#f8f6ef] sm:px-6">
        <nav aria-label="Navegacion principal" class="mx-auto flex max-w-6xl items-center justify-between">
            <a href="{% url 'producto_list' %}" class="group flex items-center gap-3 font-semibold tracking-tight focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-lime-400">
                <span class="flex size-10 items-center justify-center bg-lime-400 text-stone-950 transition group-hover:rotate-[-8deg]" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.15v4.07a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6.27A2.25 2.25 0 0 1 6 4.02h4.08M15.75 3.52H20.5m0 0v4.75m0-4.75L12 12.02" /></svg>
                </span>
                <span class="display-font text-2xl font-bold uppercase tracking-wide">SNEAK<span class="text-lime-400">//</span>CTRL</span>
            </a>
            <div class="flex items-center gap-1 sm:gap-2">
                <a href="{% url 'producto_list' %}" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-semibold text-stone-300 transition hover:text-lime-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-lime-400">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3.75h19.5v16.5H2.25V3.75ZM2.25 9h19.5M8.25 9v11.25" /></svg>
                    <span class="hidden sm:inline">Productos</span>
                    <span class="sr-only sm:hidden">Productos</span>
                </a>
                <a href="{% url 'venta_list' %}" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-semibold text-stone-300 transition hover:text-lime-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-lime-400">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.5h16.5v15H3.75v-15Zm0 4.5h16.5M8.25 4.5v15" /></svg>
                    <span class="hidden sm:inline">Ventas</span>
                    <span class="sr-only sm:hidden">Ventas</span>
                </a>
            </div>
        </nav>
    </header>
    <main id="contenido" class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
        {% if messages %}<div class="mx-auto mb-6 max-w-6xl space-y-2">{% for message in messages %}<div class="border-2 border-stone-950 bg-lime-300 px-4 py-3 text-sm font-semibold text-stone-950">{{ message }}</div>{% endfor %}</div>{% endif %}
        {% block content %}{% endblock %}
    </main>
</body>

</html>
